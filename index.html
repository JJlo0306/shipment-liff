<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>出貨單修改</title>
<style>
  body { font-family: -apple-system, "Noto Sans TC", sans-serif; padding: 16px; background: #f5f5f5; margin: 0; }
  h2 { font-size: 18px; margin: 0 0 16px; }
  label { display: block; font-size: 13px; color: #555; margin: 12px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; background: #fff; }
  .item-card { background: #fff; border-radius: 8px; padding: 12px; margin: 10px 0; box-shadow: 0 1px 3px rgba(0,0,0,.1); position: relative; }
  .item-row { display: flex; gap: 8px; }
  .item-row > div { flex: 1; }
  .del-btn { position: absolute; top: 8px; right: 8px; background: #f5f5f5; border: none; border-radius: 4px; padding: 4px 8px; color: #c00; font-size: 13px; }
  .add-btn { width: 100%; padding: 10px; background: #eee; border: 1px dashed #999; border-radius: 6px; margin: 10px 0; font-size: 14px; color: #333; }
  .submit-btn { width: 100%; padding: 14px; background: #002B49; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 20px; }
  .loading { text-align: center; padding: 40px 0; color: #888; }
  .section-title { font-weight: bold; font-size: 14px; margin: 16px 0 4px; color: #002B49; }
</style>
</head>
<body>
<div id="app"><div class="loading" id="status">準備中...</div></div>

<script>
// 防止瀏覽器/LINE內建瀏覽器用「返回上一頁快取」還原成上一次開的舊資料（例如先開了第2張又跳出，
// 再開第1張時卻還顯示第2張內容）——偵測到頁面是從快取還原的就強制重新整理，確保每次都是真的重新讀取。
window.addEventListener("pageshow", function (e) {
  if (e.persisted) location.reload();
});
// 保險絲：萬一LINE內建瀏覽器用某種內部機制切換了網址、卻沒有真的觸發上面那個事件，
// 每秒檢查一次網址列的key有沒有變過，變了就強制重新整理，確保不會停在舊資料畫面上。
(function () {
  const initialSearch = location.search;
  setInterval(function () {
    if (location.search !== initialSearch) location.reload();
  }, 800);
})();
window.onerror = function (msg, src, line, col, err) {
  showFatal_("JS錯誤：" + msg + "（第" + line + "行）");
  return false;
};
function showFatal_(msg) {
  const app = document.getElementById("app");
  if (app) app.innerHTML = "<div class='loading'>" + msg + "<br><button class='add-btn' onclick='location.reload()'>🔄 重新整理</button></div>";
}
</script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" onerror="showFatal_('LIFF SDK載入失敗，請檢查網路連線')"></script>
<script>
// ⚠️ 這兩個值是固定的設定，如果之後LIFF App或GAS部署網址改了，要一起更新這裡
const LIFF_ID = "2011022005-LGCOChYu";
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz5SSQNK_4YOjZTasKFOoXMoJNRUl_NsIRm3imgZG9qs4tpV-QNGkvhbvUVBVnE4QMkug/exec";
const STORES = ["金山店", "光華店"];

const params = new URLSearchParams(location.search);
const approvalKey = params.get("key");
let currentUserId = null;

function setStatus_(msg) {
  const el = document.getElementById("status");
  if (el) el.textContent = msg;
}

const timeoutTimer = setTimeout(function () {
  showFatal_("載入時間過長，可能是網路問題，或LIFF設定有誤。");
}, 15000);

if (typeof liff === "undefined") {
  clearTimeout(timeoutTimer);
  showFatal_("LIFF SDK沒有載入成功（liff物件不存在）");
} else {
  setStatus_("初始化LIFF中...（liffId=" + LIFF_ID + "）");
  liff.init({ liffId: LIFF_ID }).then(() => {
    setStatus_("初始化成功，確認登入狀態中...");
    if (!liff.isLoggedIn()) { setStatus_("尚未登入，跳轉登入中..."); liff.login(); return; }
    setStatus_("讀取你的LINE資料中...");
    return liff.getProfile();
  }).then(profile => {
    if (!profile) return;
    currentUserId = profile.userId;
    setStatus_("讀取出貨單資料中...");
    const q = (approvalKey ? "?action=getRecord&key=" + encodeURIComponent(approvalKey) : "?action=getRecord&userId=" + encodeURIComponent(currentUserId))
      + "&_=" + Date.now(); // 加時間戳避免抓到快取的舊資料
    return fetch(SCRIPT_URL + q, { cache: "no-store" }).then(r => r.json());
  }).then(record => {
    clearTimeout(timeoutTimer);
    if (record) renderForm_(record);
  }).catch(err => {
    clearTimeout(timeoutTimer);
    showFatal_("讀取失敗：" + (err && (err.message || err.toString && err.toString()) || JSON.stringify(err)));
  });
}

function renderForm_(record) {
  const items = (record.items && record.items.length) ? record.items : [{ name: "", unit: "", qty: "", unit_price: "", amount: "" }];
  const app = document.getElementById("app");
  const storeOptions = STORES.map(s =>
    "<option value='" + esc_(s) + "'" + (s === record.store ? " selected" : "") + ">" + esc_(s) + "</option>"
  ).join("");
  app.innerHTML =
    "<h2>📋 出貨單內容修改</h2>" +
    "<label>分店</label><select id='f_store'>" + storeOptions + "</select>" +
    "<label>日期</label><input id='f_date' type='text' placeholder='YYYY-MM-DD' value='" + esc_(record.date) + "'>" +
    "<label>廠商</label><input id='f_vendor' type='text' value='" + esc_(record.vendor) + "'>" +
    "<div class='section-title'>品項明細</div>" +
    "<div id='items'></div>" +
    "<button class='add-btn' onclick='addItem_()'>＋ 新增品項</button>" +
    "<label>總金額</label><input id='f_total' type='number' value='" + esc_(record.total_amount) + "'>" +
    "<button class='submit-btn' onclick='submitForm_()'>✅ 送出</button>";
  items.forEach(it => addItem_(it));
}

function addItem_(it) {
  it = it || {};
  const div = document.createElement("div");
  div.className = "item-card";
  div.innerHTML =
    "<button class='del-btn' onclick='this.parentElement.remove()'>🗑 刪除</button>" +
    "<label>品名</label><input class='f_name' type='text' value='" + esc_(it.name) + "'>" +
    "<div class='item-row'>" +
      "<div><label>單位</label><input class='f_unit' type='text' value='" + esc_(it.unit) + "'></div>" +
      "<div><label>數量</label><input class='f_qty' type='number' value='" + esc_(it.qty) + "'></div>" +
    "</div>" +
    "<div class='item-row'>" +
      "<div><label>單價</label><input class='f_price' type='number' value='" + esc_(it.unit_price) + "'></div>" +
      "<div><label>金額</label><input class='f_amount' type='number' value='" + esc_(it.amount) + "'></div>" +
    "</div>";
  document.getElementById("items").appendChild(div);
}

function esc_(v) {
  return (v === null || v === undefined) ? "" : String(v).replace(/'/g, "&#39;");
}

function numOrNull_(v) {
  if (v === "" || v === null || v === undefined) return null;
  const n = Number(v);
  return isNaN(n) ? null : n;
}

function submitForm_() {
  const items = Array.from(document.querySelectorAll(".item-card")).map(card => ({
    name: card.querySelector(".f_name").value,
    unit: card.querySelector(".f_unit").value,
    qty: numOrNull_(card.querySelector(".f_qty").value),
    unit_price: numOrNull_(card.querySelector(".f_price").value),
    amount: numOrNull_(card.querySelector(".f_amount").value)
  })).filter(it => it.name);

  const data = {
    store: document.getElementById("f_store").value,
    date: document.getElementById("f_date").value || null,
    vendor: document.getElementById("f_vendor").value || null,
    items: items,
    total_amount: numOrNull_(document.getElementById("f_total").value)
  };

  document.getElementById("app").innerHTML = "<div class='loading'>送出中...</div>";

  fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ liffAction: "submitEdit", userId: currentUserId, key: approvalKey || null, data: data })
  }).then(() => {
    document.getElementById("app").innerHTML = "<div class='loading'>✅ 已更新，可以關閉這個視窗了</div>";
    setTimeout(() => liff.closeWindow(), 1200);
  }).catch(err => {
    document.getElementById("app").innerHTML = "<div class='loading'>送出失敗：" + err + "</div>";
  });
}
</script>
</body>
</html>
